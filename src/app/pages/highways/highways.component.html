@if (error(); as loadError) {
  <p role="alert">Could not load highways: {{ loadError.message }}</p>
}
<form
  nz-form
  nzLayout="inline"
  style="margin-bottom: 24px"
  [formGroup]="validateForm"
  (ngSubmit)="submitForm()"
>
  <nz-form-item>
    <nz-form-label>State</nz-form-label>
    <nz-form-control nzErrorTip="Please select an option">
      <nz-select
        formControlName="hwId"
        aria-label="Autobahn"
        style="width: 260px"
        nzShowSearch
        nzAllowClear
        nzPlaceHolder="Select or search"
        [nzLoading]="isLoading()"
      >
        @for (autobahn of autobahns(); track autobahn) {
          <nz-option [nzValue]="autobahn" [nzLabel]="autobahn"></nz-option>
        }
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-control>
      <button nz-button nzType="primary">Search</button>
    </nz-form-control>
  </nz-form-item>
</form>

{{highwayId()}}
