<nz-table
  #basicTable
  [nzData]="store.states()"
  [nzLoading]="store.isLoading()"
  [nzFrontPagination]="false"
  [nzPageIndex]="store.pageIndex()"
  [nzPageSize]="store.pageSize()"
  [nzTotal]="store.totalResults()"
  (nzPageIndexChange)="onPageIndexChange($event)"
  nzBordered
>
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Area</th>
  </tr>
  </thead>

  <tbody>
  @for (state of basicTable.data; track state.id) {
  <tr>
    <td>{{ state.id }}</td>
    <td>{{ state.name }}</td>
    <td>{{ state.area }}</td>
  </tr>
  }
  </tbody>
</nz-table>
